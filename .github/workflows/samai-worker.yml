name: SamAI comment worker

on:
  schedule:
    # One GitHub-hosted pass every 15 minutes, offset from the hour.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Run once, or pause/resume scheduled processing
        required: true
        type: choice
        options:
          - run
          - stats
          - stop
          - start

permissions:
  contents: read

concurrency:
  group: samai-comment-worker
  cancel-in-progress: false

jobs:
  worker:
    if: vars.SAMAI_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # GitHub Actions is the only worker; Supabase remains the state store.
      SAMAI_DAEMON_MODE: "false"
      DRY_RUN: "false"
      AUTO_PUBLISH: "true"
      WORKER_OPERATION: ${{ github.event.inputs.operation || 'run' }}
      POLL_SECONDS: "3600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run one worker cycle
        run: python run_worker_once.py
